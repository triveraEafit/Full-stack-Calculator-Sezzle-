server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forwarded server-side to the backend container. The browser never
    # sees calculator-backend:8080 directly — it only talks to this
    # nginx origin, which is why no CORS headers are needed here.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://backend:8080;
    }

    # SPA fallback so client-side routing (if any is added later)
    # doesn't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
